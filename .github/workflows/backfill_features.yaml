name: Feature Backfill

on:
  workflow_dispatch:
    inputs:
      n_coins:
        description: "Number of coins to fetch from CoinGecko API"
        required: false
        default: "100"
        type: number
      currency:
        description: "Currency of the fetched coin Data"
        required: false
        default: "chf"
        type: string
      n_days:
        description: "Number of days the backfill should be executed for"
        required: false
        default: 365
        type: number

permissions:
  contents: read
  id-token: write

jobs:
  batch-features:
    runs-on: ubuntu-latest

    env:
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      N_COINS: ${{ inputs.n_coins }}
      CURRENCY: ${{ inputs.currency }}
      N_DAYS: ${{ inputs.n_days }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Download existing data from GCS
        run: |
          mkdir -p data/raw/backfill data/raw/hourly data/staging data/aggregated data/online_store

          gcloud storage cp gs://${{ vars.GCS_BUCKET_NAME }}/staging/market_data.parquet data/staging/market_data.parquet || true
         
      - name: Run backfill feature pipeline
        run: uv run feature-backfill --n-coins "$N_COINS" --currency "$CURRENCY" --n-days "$N_DAYS"


      - name: Upload updated data to GCS
        run: |
          gcloud storage cp --recursive data/raw/backfill/* gs://${{ vars.GCS_BUCKET_NAME }}/raw/backfill/

          gcloud storage cp data/staging/market_data.parquet gs://${{ vars.GCS_BUCKET_NAME }}/staging/market_data.parquet
          gcloud storage cp data/aggregated/feature_data.parquet gs://${{ vars.GCS_BUCKET_NAME }}/offline_store/feature_data.parquet
          gcloud storage cp data/online_store/online_features.parquet gs://${{ vars.GCS_BUCKET_NAME }}/online_store/online_features.parquet
