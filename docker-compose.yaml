services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8080"
    env_file:
      - .env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /gcp/application_default_credentials.json
      GOOGLE_CLOUD_PROJECT: mlops-496411
    volumes:
      - ./data:/app/data
      - ${APPDATA}/gcloud/application_default_credentials.json:/gcp/application_default_credentials.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8080"
    env_file:
      - .env
    environment:
      API_URL: "http://api:8080"
    depends_on:
      api:
        condition: service_healthy
