name: Batch Feature Refresh

on:
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch:

jobs:
  batch-features:
    runs-on: ubuntu-latest

    env:
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Run batch feature pipeline
        run: uv run feature-batch